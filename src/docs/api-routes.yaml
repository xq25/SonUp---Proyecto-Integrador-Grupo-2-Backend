    "patch": {
      "tags": [
        "Perfiles"
      ],
      "summary": "Actualizar perfil",
      "description": "**Roles:** ADMIN",
      "security": [
        {
          "bearerAuth": []
        },
        {
          "actorId": []
        }
      ],
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "properties": {
                "firstNames": {
                  "type": "string",
                  "description": "string. 1–100"
                },
                "lastNames": {
                  "nullable": true,
                  "type": "string",
                  "description": "string | null. 1–100"
                },
                "phone": {
                  "nullable": true,
                  "type": "string",
                  "pattern": "^\\+?\\d{7,15}$",
                  "description": "string | null. 7–15 dígitos, `+` opcional"
                },
                "documentType": {
                  "nullable": true,
                  "type": "string",
                  "enum": [
                    "CC",
                    "TI",
                    "CE",
                    "PA",
                    "RC",
                    "PPT",
                    "NIT"
                  ],
                  "description": "string | null. `CC` | `TI` | `CE` | `PA` | `RC` | `PPT` | `NIT`"
                },
                "documentNumber": {
                  "nullable": true,
                  "type": "string",
                  "pattern": "^[A-Za-z0-9-]{3,20}$",
                  "description": "string | null. 3–20 letras, números o `-`"
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "activo",
                    "inactivo",
                    "bloqueado"
                  ],
                  "description": "string. `activo` | `inactivo` | `bloqueado`"
                },
                "dataProcessingAcceptedAt": {
                  "nullable": true,
                  "description": "string | null. texto ISO 8601 con zona (ej. \"2026-10-20T15:00:00Z\")"
                }
              },
              "additionalProperties": false
            },
            "example": {
              "firstNames": "Ana María",
              "phone": "+573001112233",
              "dataProcessingAcceptedAt": "2026-10-27T15:00:00Z"
            }
          }
        }
      },
      "responses": {
        "200": {
          "description": "Correcto"
        },
