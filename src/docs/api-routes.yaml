  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "description": "Token del login (el de Saga): trae el usuario y sus roles"
      },
      "actorId": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Actor-Id",
        "description": "Solo fuera de producción: id del usuario. Roles con X-Actor-Roles (sin ella, ADMIN)"
      }
    },
    "schemas": {
      "ApiError": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "details": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "path": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  },
  "/health": {
    "get": {
      "tags": [
        "Estado"
      ],
      "summary": "Estado del servicio (pública)",
