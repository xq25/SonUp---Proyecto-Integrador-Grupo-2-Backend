        "200": {
          "description": "Correcto"
        }
      }
    }
  },
  "/auth/register": {
    "post": {
      "tags": [
        "Autenticación"
      ],
      "summary": "Registrar usuario (pública)",
      "description": "**Roles:** Pública",
      "security": [],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "properties": {
                "username": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 100,
                  "pattern": "^\\S+$",
                  "description": "string. 1–100, sin espacios"
                },
                "email": {
                  "type": "string",
                  "description": "string. email válido, máx. 254 (se envía tal cual)"
                },
                "password": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128,
                  "description": "string. 1–128; no se transforma"
                },
                "role": {
                  "type": "string",
                  "pattern": "^[A-Z_]{2,30}$",
                  "description": "string. código de rol (letras y `_`), se pasa a mayúsculas. El registro público admite `ACUDIENTE` | `DONANTE`"
                }
              },
              "required": [
                "username",
                "email",
                "password",
                "role"
              ],
              "additionalProperties": false
            },
            "example": {
              "username": "carlos.donante",
              "email": "carlos@prueba.com",
              "password": "ClaveDonante2026",
              "role": "DONANTE"
            }
          }
        }
      },
      "responses": {
        "201": {
          "description": "Creado"
        },
        "400": {
          "description": "Datos inválidos",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApiError"
              }
            }
          }
        },
        "401": {
          "description": "Sin autenticación válida",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApiError"
              }
            }
          }
        },
        "403": {
          "description": "El rol del usuario no tiene permiso (o el servicio de seguridad lo rechaza)",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApiError"
              }
            }
          }
        },
        "409": {
          "description": "Conflicto con el estado actual",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApiError"
              }
            }
          }
        },
        "429": {
          "description": "Demasiados intentos",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApiError"
              }
            }
          }
        },
        "502": {
          "description": "El módulo administrativo falló",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApiError"
              }
            }
          }
        },
        "503": {
          "description": "Autenticación sin configurar",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApiError"
              }
            }
          }
        },
        "504": {
          "description": "El módulo administrativo no respondió a tiempo",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApiError"
              }
            }
          }
        }
      }
    }
  },
