  "/credentials": {
    "post": {
      "tags": [
        "Credenciales"
      ],
      "summary": "Registrar credencial (nace `pending`)",
      "description": "**Roles:** ADMIN, TALLERISTA",
      "security": [
        {
          "bearerAuth": []
        },
        {
          "actorId": []
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "properties": {
                "studentId": {
                  "description": "number | string. número o texto con un entero > 0 (ej. 12 o \"12\")"
                },
                "organizationName": {
                  "type": "string",
                  "description": "string. 2–150"
                },
                "workshopId": {
                  "nullable": true,
                  "description": "number | string | null. número o texto con un entero > 0 (ej. 12 o \"12\")"
                },
                "url": {
                  "type": "string",
                  "maxLength": 2048,
                  "pattern": "^\\S+$",
                  "description": "string. URL `https://…`, sin espacios, máx. 2048"
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "pending"
                  ],
                  "description": "string. solo `pending` (toda credencial nace `pending`)"
                }
              },
              "required": [
                "studentId",
                "organizationName",
                "url"
              ],
              "additionalProperties": false
            },
            "example": {
              "studentId": 1,
              "organizationName": "Fundación Asisco",
              "url": "https://storage.fundacion.test/certificados/c-1.pdf",
              "workshopId": 1
            }
          }
        }
      },
      "responses": {
        "201": {
          "description": "Creado"
        },
        "400": {
          "description": "Datos inválidos",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApiError"
